name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Ejecutar pruebas con cobertura (minimo 70%)
        run: npm test

  build-push:
    name: Construir y publicar imagen
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/api-cicd:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/api-cicd:${{ github.sha }}

  deploy:
    name: Despliegue en EC2
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/api-cicd:latest
            docker pull $IMAGE
            # Contenedor nuevo en puerto temporal, se valida y luego se intercambia
            docker rm -f api-new 2>/dev/null || true
            docker run -d --name api-new -p 8081:3000 $IMAGE
            for i in $(seq 1 15); do
              curl -fs http://localhost:8081/api/health && break || sleep 2
            done
            docker rm -f api-new
            docker rm -f api 2>/dev/null || true
            docker run -d --name api --restart unless-stopped -p 80:3000 $IMAGE
            docker image prune -f
